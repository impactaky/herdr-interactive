id = "interactive"
name = "ask"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Send an annotated selection from any pane to an agent."
platforms = ["linux"]

[[panes]]
id = "compose"
title = "ask · Enter next / V range / j,k ↑↓ / PgUp,Dn / Esc"
placement = "overlay"
command = ["bash", "-c", 'exec bash "${HERDR_PLUGIN_ROOT:?}/run.sh" compose']

[[actions]]
id = "ask"
title = "Ask about this"
contexts = ["pane", "selection"]
command = ["bash", "run.sh", "open"]
